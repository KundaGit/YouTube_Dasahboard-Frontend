<div class="explore-page"  #scrollContainer
  (scroll)="onContainerScroll($event)">
  <div class="yt-header">
    <!-- <div class="yt-logo">
      <span class="play-icon">▶</span>
      <span>YouTube</span>
    </div> -->

    <div class="yt-logo">
      <div class="yt-icon">▶</div>

      <span>YouTube</span>
    </div>
    <div class="yt-count">{{ videos.length }} Videos</div>
  </div>

  <!-- Search box -->

  <div class="yt-search">
    <input type="text" [(ngModel)]="searchTerm" placeholder="Search" />

    <button (click)="searchYoutube()">🔍</button>
  </div>
  <!-- <div class="tabs"> -->
  <div class="chips">
    <button class="active">All</button>
    <button>Music</button>
    <button>Gaming</button>
    <button>Podcasts</button>

    <button *ngIf="activeTab === 'search'">Search Results</button>
  </div>
  <div class="player-section" *ngIf="selectedVideoId">
    <iframe
      [src]="safeVideoUrl"
      allowfullscreen
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
      "
    >
    </iframe>
  </div>

  <div class="video-grid">
    <div
      class="video-card"
      *ngFor="let v of videos; let i = index"
      (click)="playVideo(v.videoId || v.id?.videoId || v.id, v)"
    >
      <!-- <img class="thumb" [src]="v.snippet.thumbnails.high.url"> -->
      <div class="thumb-wrap">
        <img class="thumb" [src]="v.snippet.thumbnails.high.url" />

        <div class="play-overlay">
          <!-- ▶ -->
        </div>
      </div>

      <div class="video-meta">
        <img
          class="channel-avatar"
          src="https://i.pravatar.cc/40?img={{ i }}"
        />

        <div class="info">
          <h4>
            {{ v.snippet.title }}
          </h4>

          <div class="video-stats">
            <p class="channel-name">
              {{ v.snippet.channelTitle }}
            </p>

            <span> {{ formatViews(v.statistics?.viewCount) }} views </span>

            <span>•</span>

            <span>2 days ago</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="loading" *ngIf="loadingMore">Loading more videos...</div>
</div>
